services:
  cosmos:
    # The legacy amd64 image crashes under QEMU on Apple Silicon, so use the
    # native arm64 "vnext" emulator build. It is a different (thin-client)
    # emulator, so its config differs: HTTPS on 8081 (matching the connection
    # string the app already uses) and persistence via DATA_PATH.
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest-arm64
    container_name: kitameraki-cosmos
    ports:
      - "8081:8081"   # Cosmos NoSQL gateway (HTTPS)
      - "8080:8080"   # health probe (/alive, /ready, /status)
      - "1234:1234"   # data explorer
    environment:
      DATA_PATH: "/data"
      PROTOCOL: "https"
      PORT: "8081"
    volumes:
      - cosmos-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  cosmos-data:
